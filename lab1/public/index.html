<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 1 – Teodora Stergarel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <h1>Laborator 1 – WAP</h1>
  </header>

  <main class="container">
    <!-- Treapta 1: detalii proprii -->
    <section class="card profile" aria-labelledby="profile-title">
      <h2 id="profile-title">Despre mine</h2>
      <dl class="details">
        <div>
          <dt>Nume</dt>
          <dd>Stergarel</dd>
        </div>
        <div>
          <dt>Prenume</dt>
          <dd>Teodora</dd>
        </div>
        <div>
          <dt>Email</dt>
          <dd><a href="mailto:teodora@example.com">teodora@example.com</a></dd>
        </div>
        <div>
          <dt>Telefon</dt>
          <dd><a href="tel:+40700000000">+40 700 000 000</a></dd>
        </div>
      </dl>

      <h3>Skills</h3>
      <ul class="skills">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Python</li>
        <li>SQL</li>
        <li>Git</li>
      </ul>
    </section>

    <!-- Treapta 1: formular de adăugare validat în JavaScript; din Treapta 3 salvează prin API -->
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">Adaugă o carte</h2>
      <form id="book-form" novalidate>
        <div class="field">
          <label for="title">Titlu</label>
          <input type="text" id="title" name="title" autocomplete="off" aria-describedby="title-error">
          <p class="error" id="title-error" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="author">Autor</label>
          <input type="text" id="author" name="author" autocomplete="off" aria-describedby="author-error">
          <p class="error" id="author-error" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="year">An apariție</label>
          <input type="text" id="year" name="year" inputmode="numeric" autocomplete="off" aria-describedby="year-error">
          <p class="error" id="year-error" aria-live="polite"></p>
        </div>
        <div class="actions">
          <button type="submit" id="submit-button">Adaugă</button>
          <button type="button" id="cancel-button" class="secondary" hidden>Anulează</button>
        </div>
        <p class="error" id="form-error" role="alert"></p>
      </form>
    </section>

    <!-- Treapta 2: căutare după titlu prin Open Library API -->
    <section class="card wide" aria-labelledby="search-title">
      <h2 id="search-title">Caută o carte în Open Library</h2>
      <form id="search-form" class="search-form" role="search">
        <label for="search-input" class="visually-hidden">Titlu</label>
        <input type="search" id="search-input" name="q" placeholder="ex. Ion" autocomplete="off">
        <button type="submit" id="search-button">Caută</button>
      </form>
      <p id="search-status" class="status" role="status" aria-live="polite" hidden></p>
      <ul id="search-results" class="book-list"></ul>
    </section>

    <section class="card wide" aria-labelledby="books-title">
      <h2 id="books-title">Cărțile mele</h2>
      <p id="books-status" class="status" role="status" aria-live="polite">Se încarcă...</p>
      <ul id="book-list" class="book-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
  <script src="search.js"></script>
</body>
</html>
