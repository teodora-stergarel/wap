services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wap
      POSTGRES_PASSWORD: wap_dev_password
      POSTGRES_DB: wap_lab1
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wap -d wap_lab1"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
